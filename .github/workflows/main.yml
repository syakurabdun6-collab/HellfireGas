name: Build HellfireGas

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract src.zip
        run: |
          if [ -f src.zip ]; then
            unzip -o src.zip -d .
          else
            echo "src.zip tidak ditemukan!"
            exit 1
          fi

          if [ ! -d src ]; then
            echo "Folder src tidak ditemukan setelah ekstraksi."
            echo "Periksa struktur isi src.zip."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Read Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HellfireGas-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
