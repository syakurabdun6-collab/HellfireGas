name: Auto Version HellfireGas

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Pilih jenis update"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Version
        env:
          TYPE: ${{ inputs.update_type }}
        run: |
          FILE="version.txt"
          VERSION=$(cat "$FILE" 2>/dev/null || echo "1.0.0")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$TYPE" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "$NEW" > "$FILE"

          git add "$FILE"
          git commit -m "Release version $NEW"
          git push
